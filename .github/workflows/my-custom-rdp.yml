name: Windows RDP New

on:
  workflow_dispatch: {}

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Randomize Machine Identity
        shell: powershell
        run: |
          # Random computer name
          $chars = (65..90) + (48..57)
          $newName = "WIN-" + -join (1..8 | ForEach-Object { [char]($chars | Get-Random) })
          Rename-Computer -NewName $newName -Force
          Write-Host "Computer name: $newName"

          # New Machine GUID (fingerprint)
          $newGuid = [guid]::NewGuid().ToString()
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Cryptography' -Name 'MachineGuid' -Value $newGuid -Force
          Write-Host "Machine GUID: $newGuid"

          # Random Product ID
          $randPid = -join (1..20 | ForEach-Object { Get-Random -Min 0 -Max 10 })
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' -Name 'ProductId' -Value $randPid -Force -ErrorAction SilentlyContinue
          Write-Host "Product ID: $randPid"

          # Random Hardware Profile GUID
          $hwGuid = [guid]::NewGuid().ToString("B")
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\IDConfigDB\Hardware Profiles\0001' -Name 'HwProfileGuid' -Value $hwGuid -Force -ErrorAction SilentlyContinue

          # Clean ALL possible OpenCode / AI tool caches
          $cleanPaths = @(
            "$env:USERPROFILE\.opencode",
            "$env:APPDATA\opencode",
            "$env:LOCALAPPDATA\opencode",
            "$env:USERPROFILE\.config\opencode",
            "$env:APPDATA\@opencode",
            "$env:LOCALAPPDATA\@opencode",
            "$env:USERPROFILE\.cache\opencode",
            "$env:LOCALAPPDATA\Temp\opencode*"
          )
          foreach ($p in $cleanPaths) {
            Get-Item $p -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host "All caches cleaned."

      - name: Configure RDP and Create User
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Rule" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

          $cfgPath = "$env:TEMP\secpol.cfg"
          $dbPath  = "$env:TEMP\secedit.sdb"
          secedit /export /cfg $cfgPath
          $content = Get-Content $cfgPath -Encoding Unicode
          $content = $content -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
          $content = $content -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'
          $content | Set-Content $cfgPath -Encoding Unicode
          secedit /configure /db $dbPath /cfg $cfgPath /areas SECURITYPOLICY /quiet
          gpupdate /force | Out-Null

          net user RDP 12345 /add
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add

          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'ConsentPromptBehaviorAdmin' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'EnableLUA' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'PromptOnSecureDesktop' -Value 0 -Force
          Write-Host "User: RDP | Password: 12345"

      - name: Install Cloudflare WARP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ipBefore = (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10)
          Write-Host "IP before: $ipBefore"

          Invoke-WebRequest -Uri "https://1111-releases.cloudflareclient.com/windows/Cloudflare_WARP_Release-x64.msi" -OutFile "$env:TEMP\warp.msi" -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\warp.msi`"", "/quiet", "/norestart", "ORGANIZATION=`"`"" -Wait
          Remove-Item "$env:TEMP\warp.msi" -Force
          Start-Sleep -Seconds 3

          $warpCli = "$env:ProgramFiles\Cloudflare\Cloudflare WARP\warp-cli.exe"
          if (-not (Test-Path $warpCli)) { $warpCli = "${env:ProgramFiles(x86)}\Cloudflare\Cloudflare WARP\warp-cli.exe" }

          & $warpCli registration new 2>$null
          Start-Sleep -Seconds 2
          & $warpCli mode warp 2>$null
          & $warpCli connect 2>$null
          Start-Sleep -Seconds 4

          $ipAfter = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10) } catch { "unknown" }
          if ($ipAfter -eq $ipBefore) {
            & $warpCli disconnect 2>$null; Start-Sleep 1
            & $warpCli registration delete 2>$null; Start-Sleep 1
            & $warpCli registration new 2>$null; Start-Sleep 2
            & $warpCli connect 2>$null; Start-Sleep 4
            $ipAfter = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10) } catch { "unknown" }
          }
          Write-Host "WARP IP: $ipAfter"

      - name: Install OpenCode
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Clean old data
          @("$env:USERPROFILE\.opencode","$env:APPDATA\opencode","$env:LOCALAPPDATA\opencode","$env:USERPROFILE\.config\opencode") | ForEach-Object {
            if (Test-Path $_) { Remove-Item $_ -Recurse -Force -ErrorAction SilentlyContinue }
          }

          npm uninstall --global opencode-ai 2>$null | Out-Null
          npm install --global @opencode/cli@latest
          if ($LASTEXITCODE -ne 0) { throw "OpenCode install failed" }
          Write-Host "OpenCode $(& opencode --version)"

          # Create 'lm' alias
          $binDir = Join-Path $env:USERPROFILE "bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          "@echo off`r`nopencode %*`r`n" | Set-Content -Path "$binDir\lm.cmd" -Encoding ASCII
          $userPath = [Environment]::GetEnvironmentVariable("Path","User")
          if (($userPath -split ";") -notcontains $binDir) {
            [Environment]::SetEnvironmentVariable("Path","$userPath;$binDir","User")
          }
          $env:Path = "$binDir;$env:Path"

          @((Join-Path $env:USERPROFILE "Documents\WindowsPowerShell"),(Join-Path $env:USERPROFILE "Documents\PowerShell")) | ForEach-Object {
            New-Item -ItemType Directory -Path $_ -Force | Out-Null
            $p = Join-Path $_ "Microsoft.PowerShell_profile.ps1"
            if (-not (Test-Path $p) -or -not (Select-String -Path $p -Pattern "function lm" -Quiet)) {
              Add-Content -Path $p -Value "`nfunction lm { opencode @args }`n"
            }
          }

      - name: "Diagnostic: Test MiniMax + GLM"
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          # Setup test git repo
          $testDir = "$env:TEMP\oc-diag"
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          Push-Location $testDir
          git init | Out-Null
          git config user.email "t@t.com"
          git config user.name "t"
          "x" | Set-Content "t.txt"
          git add . | Out-Null
          git commit -m "i" 2>$null | Out-Null

          $currentIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10) } catch { "unknown" }
          Write-Host ""
          Write-Host "============================================" -ForegroundColor Cyan
          Write-Host "  OpenCode Diagnostic (MiniMax + GLM)" -ForegroundColor Cyan
          Write-Host "  IP: $currentIp" -ForegroundColor Cyan
          Write-Host "  Machine: $env:COMPUTERNAME" -ForegroundColor Cyan
          Write-Host "============================================" -ForegroundColor Cyan
          Write-Host ""

          # Only test the 2 models you need
          $models = @(
            "opencode/minimax-m3.1-flash-free",
            "opencode/glm-5.3-flash-free"
          )

          $working = @()
          $failed = @()
          $warpCli = "$env:ProgramFiles\Cloudflare\Cloudflare WARP\warp-cli.exe"
          if (-not (Test-Path $warpCli)) { $warpCli = "${env:ProgramFiles(x86)}\Cloudflare\Cloudflare WARP\warp-cli.exe" }

          foreach ($model in $models) {
            Write-Host "  Testing $model ... " -NoNewline

            $outFile = "$testDir\out_$([guid]::NewGuid().ToString('N').Substring(0,8)).txt"
            $errFile = "$testDir\err_$([guid]::NewGuid().ToString('N').Substring(0,8)).txt"

            try {
              $proc = Start-Process -FilePath "cmd.exe" `
                -ArgumentList "/c","opencode","run","--standalone","--model",$model,"--archived","say ok" `
                -NoNewWindow -PassThru `
                -RedirectStandardOutput $outFile `
                -RedirectStandardError $errFile

              $finished = $proc.WaitForExit(45000)

              if (-not $finished) {
                $proc.Kill()
                Write-Host "TIMEOUT" -ForegroundColor Yellow
                $failed += $model
                continue
              }

              $stdout = if (Test-Path $outFile) { Get-Content $outFile -Raw } else { "" }
              $stderr = if (Test-Path $errFile) { Get-Content $errFile -Raw } else { "" }
              $all = "$stdout $stderr"

              if ($all -match "limit|exhausted|rate|quota|429|exceeded|too many|blocked") {
                Write-Host "RATE LIMITED" -ForegroundColor Red
                $failed += $model
              } elseif ($all -match "(?i)ok") {
                $cleanResp = ($all -split "`n" | Where-Object { $_.Trim() -ne "" } | Select-Object -First 2) -join " "
                Write-Host "OK -> $cleanResp" -ForegroundColor Green
                $working += $model
              } else {
                $errMsg = if ($all.Trim().Length -gt 0) { $all.Trim().Substring(0, [Math]::Min(80, $all.Trim().Length)) } else { "empty response" }
                Write-Host "FAILED ($errMsg)" -ForegroundColor Red
                $failed += $model
              }
            } catch {
              Write-Host "ERROR: $_" -ForegroundColor Red
              $failed += $model
            }
          }

          Pop-Location
          Remove-Item $testDir -Recurse -Force -ErrorAction SilentlyContinue

          # Print summary
          Write-Host ""
          Write-Host "============================================" -ForegroundColor Cyan
          Write-Host "  RESULTS" -ForegroundColor Cyan
          Write-Host "============================================" -ForegroundColor Cyan

          if ($working.Count -gt 0) {
            foreach ($m in $working) { Write-Host "  + $m" -ForegroundColor Green }
          }
          if ($failed.Count -gt 0) {
            foreach ($m in $failed) { Write-Host "  x $m" -ForegroundColor Red }
          }

          Write-Host ""

          # AUTO-STOP if BOTH models failed
          if ($working.Count -eq 0) {
            Write-Host "  BOTH MODELS FAILED! Stopping workflow." -ForegroundColor Red
            Write-Host "  Try running again for a new IP." -ForegroundColor Red
            exit 1
          }

          Write-Host "  Use: opencode --model $($working[0])" -ForegroundColor Green
          Write-Host "============================================" -ForegroundColor Cyan

      - name: Create Helper Scripts
        shell: powershell
        run: |
          $desktopPath = [Environment]::GetFolderPath("Desktop")

          # --- FIX AI.bat (One-click fix preserving projects & sessions) ---
          $fixScript = @'
          @echo off
          title FIX AI - One Click Fix
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& {
              [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
              Write-Host '===================================================' -ForegroundColor Cyan
              Write-Host '   FIX AI - Rate Limit Fixer (All Sessions)        ' -ForegroundColor Yellow
              Write-Host '===================================================' -ForegroundColor Cyan
              Write-Host ''
              Write-Host '[1/4] Closing stale OpenCode background processes...' -ForegroundColor Gray
              Get-Process -Name 'opencode' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

              Write-Host '[2/4] Cleaning temporary cache...' -ForegroundColor Gray
              Remove-Item \"$env:USERPROFILE\.cache\opencode\" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item \"$env:LOCALAPPDATA\Temp\opencode*\" -Recurse -Force -ErrorAction SilentlyContinue

              Write-Host '[3/4] Cleaning & compressing all sessions in opencode.db...' -ForegroundColor Gray
              $pyScript = @'
import sqlite3, json, os, shutil
db_path = os.path.expandvars(r'%USERPROFILE%\.local\share\opencode\opencode.db')
if os.path.exists(db_path):
    try: shutil.copyfile(db_path, db_path + '.bak')
    except: pass
    conn = sqlite3.connect(db_path)
    cur = conn.cursor()
    cur.execute('SELECT id, title, tokens_input FROM session_v2;')
    sessions = cur.fetchall()
    total_cleaned = 0
    for s_id, title, tokens_in in sessions:
        cur.execute('DELETE FROM session_message WHERE session_id=? AND (type=\"compaction\" OR (type=\"assistant\" AND data LIKE \"%\\\"finish\\\": \\\"error\\\"%\"));', [s_id])
        cur.execute('SELECT max(seq) FROM session_message WHERE session_id=?;', [s_id])
        r = cur.fetchone()
        max_seq = r[0] if r and r[0] else 0
        safe_seq = max(0, max_seq - 20)
        cur.execute('SELECT id, seq, data FROM session_message WHERE session_id=? AND type=\"assistant\" AND seq < ?;', [s_id, safe_seq])
        rows = cur.fetchall()
        for msg_id, seq, raw_data in rows:
            try:
                data = json.loads(raw_data)
                changed = False
                if 'content' in data and isinstance(data['content'], list):
                    new_c = []
                    for item in data['content']:
                        itype = item.get('type')
                        if itype == 'reasoning':
                            changed = True
                            continue
                        elif itype == 'tool' and 'state' in item and 'content' in item['state']:
                            c_list = item['state']['content']
                            if isinstance(c_list, list):
                                for c in c_list:
                                    if isinstance(c, dict) and 'text' in c and len(str(c['text'])) > 350:
                                        c['text'] = str(c['text'])[:350] + '\n... [Truncated for context]'
                                        changed = True
                            new_c.append(item)
                        else: new_c.append(item)
                    data['content'] = new_c
                if changed:
                    cur.execute('UPDATE session_message SET data=? WHERE id=?;', [json.dumps(data, ensure_ascii=False), msg_id])
                    total_cleaned += 1
            except: pass
        cur.execute('UPDATE session_v2 SET tokens_input = CASE WHEN tokens_input > 15000 THEN 15000 ELSE tokens_input END, model = replace(model, \'\"variant\":\"max\"\', \'\"variant\":\"default\"\') WHERE id = ?;', [s_id])
    conn.commit()
    conn.close()
    print(f'CLEANED_OK:{total_cleaned}')
'@
              $pyScript | python -

              Write-Host '[4/4] Rotating Cloudflare WARP to get a new IP...' -ForegroundColor Gray
              $warpCli = \"$env:ProgramFiles\Cloudflare\Cloudflare WARP\warp-cli.exe\"
              if (-not (Test-Path $warpCli)) { $warpCli = \"${env:ProgramFiles(x86)}\Cloudflare\Cloudflare WARP\warp-cli.exe\" }

              if (Test-Path $warpCli) {
                  & $warpCli disconnect 2>$null
                  Start-Sleep -Seconds 1
                  & $warpCli registration delete 2>$null
                  Start-Sleep -Seconds 1
                  & $warpCli registration new 2>$null
                  Start-Sleep -Seconds 2
                  & $warpCli connect 2>$null
                  Start-Sleep -Seconds 4
              }

              $ip = try { (Invoke-RestMethod -Uri 'https://api.ipify.org' -TimeoutSec 5) } catch { 'unknown' }

              Write-Host ''
              Write-Host '===================================================' -ForegroundColor Green
              Write-Host \"   SUCCESS! New IP: $ip\" -ForegroundColor Green
              Write-Host '   All sessions were cleaned & limits refreshed!   ' -ForegroundColor Green
              Write-Host '   MiniMax and GLM are ready to use.               ' -ForegroundColor Green
              Write-Host '===================================================' -ForegroundColor Green
              Write-Host ''
          }"
          echo Press any key to exit...
          pause >nul
          '@
          $fixScript | Set-Content "$desktopPath\FIX AI.bat" -Encoding ASCII

          # --- Start-OpenCode.bat ---
          $launcherScript = @'
          @echo off
          title OpenCode Launcher
          powershell -NoProfile -ExecutionPolicy Bypass -Command "& {
              $warpCli = \"$env:ProgramFiles\Cloudflare\Cloudflare WARP\warp-cli.exe\"
              if (-not (Test-Path $warpCli)) { $warpCli = \"${env:ProgramFiles(x86)}\Cloudflare\Cloudflare WARP\warp-cli.exe\" }
              Remove-Item \"$env:USERPROFILE\.cache\opencode\" -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item \"$env:LOCALAPPDATA\Temp\opencode*\" -Recurse -Force -ErrorAction SilentlyContinue
              $ip = try { (Invoke-RestMethod -Uri 'https://api.ipify.org' -TimeoutSec 5) } catch { 'unknown' }
              Write-Host \"Current Public IP: $ip\" -ForegroundColor Green
              Write-Host 'Launching OpenCode...' -ForegroundColor Cyan
              & opencode @args
          }"
          '@
          $launcherScript | Set-Content "$desktopPath\Start-OpenCode.bat" -Encoding ASCII

          # --- Compile FIX AI.exe GUI App ---
          $csSource = @'
          using System;
          using System.Diagnostics;
          using System.Drawing;
          using System.IO;
          using System.Net;
          using System.Threading.Tasks;
          using System.Windows.Forms;

          namespace OpenCodeFixerApp
          {
              public class MainForm : Form
              {
                  private Label lblTitle, lblSubtitle, lblIpHeader, lblIpValue, lblStatus;
                  private Panel cardIp;
                  private Button btnRefreshIp, btnFixAll, btnCleanSessionsOnly, btnTestMiniMax, btnTestGlm;
                  private TextBox txtLog;
                  private ProgressBar progressBar;

                  public MainForm()
                  {
                      InitializeComponent();
                      RefreshIpAsync();
                  }

                  private void InitializeComponent()
                  {
                      this.Text = "FIX AI - Rate Limit Fixer";
                      this.Size = new Size(550, 660);
                      this.StartPosition = FormStartPosition.CenterScreen;
                      this.FormBorderStyle = FormBorderStyle.FixedSingle;
                      this.MaximizeBox = false;
                      this.BackColor = Color.FromArgb(22, 24, 30);
                      this.Font = new Font("Segoe UI", 9.5f, FontStyle.Regular);

                      lblTitle = new Label { Text = "⚡ FIX AI", Location = new Point(20, 18), AutoSize = true, Font = new Font("Segoe UI", 16f, FontStyle.Bold), ForeColor = Color.FromArgb(235, 240, 255) };
                      this.Controls.Add(lblTitle);

                      lblSubtitle = new Label { Text = "Fix & refresh rate limits for ALL sessions in 1-click", Location = new Point(22, 54), AutoSize = true, Font = new Font("Segoe UI", 9.5f), ForeColor = Color.FromArgb(145, 155, 175) };
                      this.Controls.Add(lblSubtitle);

                      cardIp = new Panel { Location = new Point(20, 88), Size = new Size(495, 75), BackColor = Color.FromArgb(30, 33, 44) };
                      cardIp.Paint += (s, e) => { ControlPaint.DrawBorder(e.Graphics, cardIp.ClientRectangle, Color.FromArgb(48, 52, 68), ButtonBorderStyle.Solid); };

                      lblIpHeader = new Label { Text = "CURRENT PUBLIC IP:", Location = new Point(16, 12), AutoSize = true, Font = new Font("Segoe UI", 8f, FontStyle.Bold), ForeColor = Color.FromArgb(120, 130, 155) };
                      cardIp.Controls.Add(lblIpHeader);

                      lblIpValue = new Label { Text = "Loading...", Location = new Point(16, 34), AutoSize = true, Font = new Font("Segoe UI", 14f, FontStyle.Bold), ForeColor = Color.FromArgb(80, 220, 160) };
                      cardIp.Controls.Add(lblIpValue);

                      btnRefreshIp = new Button { Text = "Refresh IP", Location = new Point(375, 20), Size = new Size(100, 36), FlatStyle = FlatStyle.Flat, BackColor = Color.FromArgb(45, 48, 64), ForeColor = Color.White, Cursor = Cursors.Hand };
                      btnRefreshIp.FlatAppearance.BorderSize = 0;
                      btnRefreshIp.Click += async (s, e) => await RefreshIpAsync();
                      cardIp.Controls.Add(btnRefreshIp);
                      this.Controls.Add(cardIp);

                      btnFixAll = new Button { Text = "1-Click Fix All Sessions & Rotate IP", Location = new Point(20, 175), Size = new Size(495, 50), FlatStyle = FlatStyle.Flat, BackColor = Color.FromArgb(0, 180, 120), ForeColor = Color.White, Font = new Font("Segoe UI", 11.5f, FontStyle.Bold), Cursor = Cursors.Hand };
                      btnFixAll.FlatAppearance.BorderSize = 0;
                      btnFixAll.Click += async (s, e) => await RunFixAsync(true);
                      this.Controls.Add(btnFixAll);

                      btnCleanSessionsOnly = new Button { Text = "Clean All Sessions Only (Keep IP)", Location = new Point(20, 233), Size = new Size(495, 36), FlatStyle = FlatStyle.Flat, BackColor = Color.FromArgb(40, 44, 58), ForeColor = Color.FromArgb(200, 215, 245), Font = new Font("Segoe UI", 9.5f), Cursor = Cursors.Hand };
                      btnCleanSessionsOnly.FlatAppearance.BorderSize = 0;
                      btnCleanSessionsOnly.Click += async (s, e) => await RunFixAsync(false);
                      this.Controls.Add(btnCleanSessionsOnly);

                      btnTestMiniMax = new Button { Text = "Test MiniMax", Location = new Point(20, 277), Size = new Size(240, 38), FlatStyle = FlatStyle.Flat, BackColor = Color.FromArgb(32, 35, 46), ForeColor = Color.FromArgb(220, 230, 250), Cursor = Cursors.Hand };
                      btnTestMiniMax.FlatAppearance.BorderSize = 0;
                      btnTestMiniMax.Click += async (s, e) => await TestModelAsync("opencode/minimax-m3.1-flash-free", "MiniMax");
                      this.Controls.Add(btnTestMiniMax);

                      btnTestGlm = new Button { Text = "Test GLM", Location = new Point(275, 277), Size = new Size(240, 38), FlatStyle = FlatStyle.Flat, BackColor = Color.FromArgb(32, 35, 46), ForeColor = Color.FromArgb(220, 230, 250), Cursor = Cursors.Hand };
                      btnTestGlm.FlatAppearance.BorderSize = 0;
                      btnTestGlm.Click += async (s, e) => await TestModelAsync("opencode/glm-5.3-flash-free", "GLM");
                      this.Controls.Add(btnTestGlm);

                      progressBar = new ProgressBar { Location = new Point(20, 325), Size = new Size(495, 8), Style = ProgressBarStyle.Marquee, MarqueeAnimationSpeed = 0, Visible = false };
                      this.Controls.Add(progressBar);

                      lblStatus = new Label { Text = "Ready - Projects & sessions are 100% safe.", Location = new Point(20, 339), AutoSize = true, Font = new Font("Segoe UI", 8.5f), ForeColor = Color.FromArgb(130, 140, 160) };
                      this.Controls.Add(lblStatus);

                      txtLog = new TextBox { Location = new Point(20, 362), Size = new Size(495, 238), Multiline = true, ReadOnly = true, ScrollBars = ScrollBars.Vertical, BackColor = Color.FromArgb(15, 16, 20), ForeColor = Color.FromArgb(180, 240, 200), Font = new Font("Consolas", 9f), BorderStyle = BorderStyle.None };
                      this.Controls.Add(txtLog);
                      Log("Ready.");
                  }

                  private void Log(string m) { if (txtLog.InvokeRequired) { txtLog.Invoke(new Action(() => Log(m))); return; } txtLog.AppendText("[" + DateTime.Now.ToString("HH:mm:ss") + "] " + m + "\r\n"); }
                  private void SetWorking(bool w, string s) { if (this.InvokeRequired) { this.Invoke(new Action(() => SetWorking(w, s))); return; } btnFixAll.Enabled = !w; btnCleanSessionsOnly.Enabled = !w; btnTestMiniMax.Enabled = !w; btnTestGlm.Enabled = !w; btnRefreshIp.Enabled = !w; progressBar.Visible = w; progressBar.MarqueeAnimationSpeed = w ? 30 : 0; lblStatus.Text = s; }

                  private async Task RefreshIpAsync()
                  {
                      lblIpValue.Text = "...";
                      try {
                          string ip = await Task.Run(() => { using (var c = new WebClient()) { c.Headers["User-Agent"] = "curl/7.88"; return c.DownloadString("https://api.ipify.org").Trim(); } });
                          lblIpValue.Text = ip;
                          Log("Public IP: " + ip);
                      } catch { lblIpValue.Text = "Unknown"; Log("Failed to get IP."); }
                  }

                  private async Task RunFixAsync(bool rotateWarp)
                  {
                      SetWorking(true, "Fixing and cleaning all sessions...");
                      Log("Starting comprehensive fix...");
                      await Task.Run(() => {
                          try {
                              foreach (var p in Process.GetProcessesByName("opencode")) { try { p.Kill(); } catch {} }
                              string cacheDir = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.UserProfile), ".cache", "opencode");
                              if (Directory.Exists(cacheDir)) { try { Directory.Delete(cacheDir, true); } catch {} }
                              string tempDir = Path.GetTempPath();
                              try { foreach (var d in Directory.GetDirectories(tempDir, "opencode*")) { try { Directory.Delete(d, true); } catch {} } } catch { }

                              string pyFile = Path.Combine(tempDir, "clean_opencode_sessions.py");
                              string pyCode = 
"import sqlite3, json, os, shutil\n" +
"db_path = os.path.expandvars(r'%USERPROFILE%\\.local\\share\\opencode\\opencode.db')\n" +
"if os.path.exists(db_path):\n" +
"    try: shutil.copyfile(db_path, db_path + '.bak')\n" +
"    except: pass\n" +
"    conn = sqlite3.connect(db_path)\n" +
"    cur = conn.cursor()\n" +
"    cur.execute('SELECT id, title, tokens_input FROM session_v2;')\n" +
"    sessions = cur.fetchall()\n" +
"    total_cleaned = 0\n" +
"    for s_id, title, tokens_in in sessions:\n" +
"        cur.execute('DELETE FROM session_message WHERE session_id=? AND (type=\"compaction\" OR (type=\"assistant\" AND data LIKE \"%\\\"finish\\\": \\\"error\\\"%\"));', [s_id])\n" +
"        cur.execute('SELECT max(seq) FROM session_message WHERE session_id=?;', [s_id])\n" +
"        r = cur.fetchone()\n" +
"        max_seq = r[0] if r and r[0] else 0\n" +
"        safe_seq = max(0, max_seq - 20)\n" +
"        cur.execute('SELECT id, seq, data FROM session_message WHERE session_id=? AND type=\"assistant\" AND seq < ?;', [s_id, safe_seq])\n" +
"        rows = cur.fetchall()\n" +
"        for msg_id, seq, raw_data in rows:\n" +
"            try:\n" +
"                data = json.loads(raw_data)\n" +
"                changed = False\n" +
"                if 'content' in data and isinstance(data['content'], list):\n" +
"                    new_c = []\n" +
"                    for item in data['content']:\n" +
"                        itype = item.get('type')\n" +
"                        if itype == 'reasoning':\n" +
"                            changed = True\n" +
"                            continue\n" +
"                        elif itype == 'tool' and 'state' in item and 'content' in item['state']:\n" +
"                            c_list = item['state']['content']\n" +
"                            if isinstance(c_list, list):\n" +
"                                for c in c_list:\n" +
"                                    if isinstance(c, dict) and 'text' in c and len(str(c['text'])) > 350:\n" +
"                                        c['text'] = str(c['text'])[:350] + '\\n... [Truncated for context]'\n" +
"                                        changed = True\n" +
"                            new_c.append(item)\n" +
"                        else: new_c.append(item)\n" +
"                    data['content'] = new_c\n" +
"                if changed:\n" +
"                    cur.execute('UPDATE session_message SET data=? WHERE id=?;', [json.dumps(data, ensure_ascii=False), msg_id])\n" +
"                    total_cleaned += 1\n" +
"            except: pass\n" +
"        cur.execute('UPDATE session_v2 SET tokens_input = CASE WHEN tokens_input > 15000 THEN 15000 ELSE tokens_input END, model = replace(model, \'\"variant\":\"max\"\', \'\"variant\":\"default\"\') WHERE id = ?;', [s_id])\n" +
"    conn.commit()\n" +
"    conn.close()\n" +
"    print('CLEANED_OK:' + str(total_cleaned))\n" +
"else:\n" +
"    print('DB_NOT_FOUND')\n";

                              File.WriteAllText(pyFile, pyCode);
                              string pyOutput = RunProcessOutput("python", "\"" + pyFile + "\"");
                              try { File.Delete(pyFile); } catch { }
                              if (pyOutput.Contains("CLEANED_OK")) { Log("All sessions in opencode.db cleaned and optimized."); }
                              else { Log("Session cleaner output: " + pyOutput.Trim()); }

                              if (rotateWarp) {
                                  string progFiles = Environment.GetFolderPath(Environment.SpecialFolder.ProgramFiles);
                                  string warpCli = Path.Combine(progFiles, "Cloudflare", "Cloudflare WARP", "warp-cli.exe");
                                  if (!File.Exists(warpCli)) { warpCli = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.ProgramFilesX86), "Cloudflare", "Cloudflare WARP", "warp-cli.exe"); }
                                  if (File.Exists(warpCli)) {
                                      RunProcess(warpCli, "disconnect"); System.Threading.Thread.Sleep(1500);
                                      RunProcess(warpCli, "registration delete"); System.Threading.Thread.Sleep(1000);
                                      RunProcess(warpCli, "registration new"); System.Threading.Thread.Sleep(2000);
                                      RunProcess(warpCli, "connect"); System.Threading.Thread.Sleep(4000);
                                  }
                              }
                          } catch (Exception ex) { Log("Error: " + ex.Message); }
                      });
                      if (rotateWarp) { await RefreshIpAsync(); }
                      SetWorking(false, "Done! Ready to use.");
                      Log("SUCCESS! Sessions repaired and limits refreshed.");
                      MessageBox.Show("Fixed all sessions successfully! Ready to use.", "Success", MessageBoxButtons.OK, MessageBoxIcon.Information);
                  }

                  private async Task TestModelAsync(string modelId, string modelName)
                  {
                      SetWorking(true, "Testing " + modelName + "...");
                      Log("Testing " + modelName + " (" + modelId + ")...");
                      string r = await Task.Run(() => {
                          try {
                              var psi = new ProcessStartInfo { FileName = "cmd.exe", Arguments = "/c echo say hi | opencode run --model " + modelId + " --format default", UseShellExecute = false, RedirectStandardOutput = true, RedirectStandardError = true, CreateNoWindow = true };
                              using (var p = Process.Start(psi)) { if (p.WaitForExit(20000)) { string o = p.StandardOutput.ReadToEnd(); string e = p.StandardError.ReadToEnd(); return string.IsNullOrEmpty(o) ? e : o; } else { try { p.Kill(); } catch {} return "TIMEOUT"; } }
                          } catch (Exception ex) { return "Error: " + ex.Message; }
                      });
                      SetWorking(false, "Done.");
                      Log("Response:\r\n" + r.Trim());
                  }

                  private void RunProcess(string f, string a) { try { var p = Process.Start(new ProcessStartInfo { FileName = f, Arguments = a, UseShellExecute = false, CreateNoWindow = true }); p.WaitForExit(8000); } catch {} }

                  private string RunProcessOutput(string f, string a)
                  {
                      try {
                          var psi = new ProcessStartInfo { FileName = f, Arguments = a, UseShellExecute = false, RedirectStandardOutput = true, RedirectStandardError = true, CreateNoWindow = true };
                          using (var p = Process.Start(psi)) { if (p.WaitForExit(10000)) { return p.StandardOutput.ReadToEnd() + p.StandardError.ReadToEnd(); } }
                      } catch (Exception ex) { return ex.Message; }
                      return "";
                  }

                  [STAThread]
                  public static void Main() { Application.EnableVisualStyles(); Application.SetCompatibleTextRenderingDefault(false); Application.Run(new MainForm()); }
              }
          }
          '@
          $tmpCs = "$env:TEMP\OpenCodeFixer.cs"
          $csSource | Set-Content $tmpCs -Encoding UTF8
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:winexe /out:"$desktopPath\FIX AI.exe" /r:System.Windows.Forms.dll,System.Drawing.dll,System.dll $tmpCs
          Remove-Item $tmpCs -Force -ErrorAction SilentlyContinue

          Write-Host "Helper scripts and FIX AI.exe created on Desktop"

      - name: Install Tailscale and Connect
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\ts.msi" -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i","`"$env:TEMP\ts.msi`"","/quiet","/norestart" -Wait
          Remove-Item "$env:TEMP\ts.msi" -Force

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-$env:GITHUB_RUN_ID
          $ip = $null
          for ($i = 0; $i -lt 15; $i++) {
            $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null) | Select-Object -First 1
            if ($ip) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $ip) { Write-Error 'Tailscale IP not assigned'; exit 1 }
          $publicIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10) } catch { "unknown" }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  RDP Ready!" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "RDP Host:     $ip"
          Write-Host "RDP User:     RDP"
          Write-Host "RDP Pass:     12345"
          Write-Host "Public IP:    $publicIp (via WARP)"
          Write-Host "==========================================" -ForegroundColor Green

      - name: Install Rtl Terminal
        shell: powershell
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/mirbehnam/RtlTerminal/releases/latest" `
            -Headers @{ "User-Agent" = "github-actions"; "Accept" = "application/vnd.github+json" }
          $asset = $release.assets |
            Where-Object { $_.name -match '^RtlTerminal-Setup-.*-x64\.exe$' } |
            Select-Object -First 1
          if (-not $asset) { throw "No x64 installer found" }
          $setup = Join-Path $env:TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $setup -UseBasicParsing
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          Remove-Item $setup -Force
          Write-Host "Rtl Terminal $($release.tag_name) installed."

      - name: Keep alive 6 hours
        shell: powershell
        run: |
          $endTime = (Get-Date).AddHours(6)
          Write-Host "Session alive until $($endTime.ToString('HH:mm'))"
          while ((Get-Date) -lt $endTime) {
            Write-Host "Remaining: $(($endTime - (Get-Date)).ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 60
          }
