name: Windows RDP New

on:
  workflow_dispatch: {}

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Rule" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Rule" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Admin Privileges
        shell: powershell
        run: |
          $cfgPath = "$env:TEMP\secpol.cfg"
          $dbPath  = "$env:TEMP\secedit.sdb"
          secedit /export /cfg $cfgPath
          $content = Get-Content $cfgPath -Encoding Unicode
          $content = $content -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0'
          $content = $content -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0'
          $content | Set-Content $cfgPath -Encoding Unicode
          secedit /configure /db $dbPath /cfg $cfgPath /areas SECURITYPOLICY /quiet
          gpupdate /force | Out-Null
          net user RDP 12345 /add
          net localgroup Administrators RDP /add
          net localgroup "Remote Desktop Users" RDP /add
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'ConsentPromptBehaviorAdmin' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'EnableLUA' -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name 'PromptOnSecureDesktop' -Value 0 -Force
          Write-Host "User: RDP | Password: 12345 | Admin: Full (UAC disabled)"

      - name: Install and Connect Cloudflare WARP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Checking current public IP (before WARP)..."
          $ipBefore = (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10)
          Write-Host "IP before WARP: $ipBefore"

          Write-Host "Downloading Cloudflare WARP..."
          $warpUrl = "https://1111-releases.cloudflareclient.com/windows/Cloudflare_WARP_Release-x64.msi"
          $warpMsi = "$env:TEMP\warp.msi"
          Invoke-WebRequest -Uri $warpUrl -OutFile $warpMsi -UseBasicParsing
          Write-Host "Installing Cloudflare WARP..."
          Start-Process msiexec.exe -ArgumentList "/i", "`"$warpMsi`"", "/quiet", "/norestart", "ORGANIZATION=`"`"" -Wait
          Remove-Item $warpMsi -Force

          Start-Sleep -Seconds 5

          $warpCli = "$env:ProgramFiles\Cloudflare\Cloudflare WARP\warp-cli.exe"
          if (-not (Test-Path $warpCli)) {
            $warpCli = "${env:ProgramFiles(x86)}\Cloudflare\Cloudflare WARP\warp-cli.exe"
          }
          if (-not (Test-Path $warpCli)) {
            throw "warp-cli not found after installation"
          }

          Write-Host "Registering WARP..."
          & $warpCli registration new 2>$null
          Start-Sleep -Seconds 3

          Write-Host "Setting WARP mode to warp..."
          & $warpCli mode warp 2>$null
          Start-Sleep -Seconds 2

          Write-Host "Connecting WARP..."
          & $warpCli connect 2>$null
          Start-Sleep -Seconds 5

          # Cycle WARP to get a fresh clean IP
          Write-Host "Cycling WARP to get a fresh IP..."
          for ($cycle = 1; $cycle -le 3; $cycle++) {
            & $warpCli disconnect 2>$null
            Start-Sleep -Seconds 3
            & $warpCli registration delete 2>$null
            Start-Sleep -Seconds 2
            & $warpCli registration new 2>$null
            Start-Sleep -Seconds 3
            & $warpCli connect 2>$null
            Start-Sleep -Seconds 5
            try {
              $newIp = (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10)
              if ($newIp -ne $ipBefore) {
                Write-Host "Cycle $cycle - Got new IP: $newIp"
                break
              }
            } catch {}
          }

          $ipAfter = $null
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $ipAfter = (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10)
              if ($ipAfter -ne $ipBefore) {
                Write-Host "WARP connected! New IP: $ipAfter (was: $ipBefore)"
                break
              }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if ($ipAfter -eq $ipBefore) {
            Write-Host "Warning: IP may not have changed, but WARP service is running."
          }

          Write-Host "WARP setup complete."

      - name: Install OpenCode
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          npm uninstall --global opencode-ai 2>$null | Out-Null

          npm install --global @opencode/cli@latest
          if ($LASTEXITCODE -ne 0) {
            throw "OpenCode installation failed"
          }
          $opencode = (Get-Command opencode.cmd -ErrorAction SilentlyContinue).Source
          if (-not $opencode) {
            $opencode = (Get-Command opencode -ErrorAction SilentlyContinue).Source
          }
          if (-not $opencode) {
            throw "OpenCode was installed but its command was not found"
          }
          Write-Host "OpenCode V2 installed at: $opencode"
          Write-Host "OpenCode version: $(& opencode --version)"

          $binDir = Join-Path $env:USERPROFILE "bin"
          New-Item -ItemType Directory -Path $binDir -Force | Out-Null
          $lmCmdPath = Join-Path $binDir "lm.cmd"
          "@echo off`r`nopencode %*`r`n" | Set-Content -Path $lmCmdPath -Encoding ASCII
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $pathParts = @($userPath -split ";" | Where-Object { $_ })
          if ($pathParts -notcontains $binDir) {
            [Environment]::SetEnvironmentVariable("Path", (($pathParts + $binDir) -join ";"), "User")
          }
          $env:Path = "$binDir;$env:Path"

          $profileBlock = "`n# OpenCode launcher`nfunction lm { opencode @args }`n"
          $profileDirs = @(
            (Join-Path $env:USERPROFILE "Documents\WindowsPowerShell"),
            (Join-Path $env:USERPROFILE "Documents\PowerShell")
          )
          foreach ($profileDir in $profileDirs) {
            New-Item -ItemType Directory -Path $profileDir -Force | Out-Null
            $profilePath = Join-Path $profileDir "Microsoft.PowerShell_profile.ps1"
            if (-not (Test-Path $profilePath) -or -not (Select-String -Path $profilePath -Pattern "function lm" -Quiet)) {
              Add-Content -Path $profilePath -Value $profileBlock
            }
          }

          Write-Host "OpenCode installed. Type lm in a new PowerShell/CMD terminal to launch OpenCode."

      - name: Test OpenCode and Auto-Fix IP if Limits Hit
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          $warpCli = "$env:ProgramFiles\Cloudflare\Cloudflare WARP\warp-cli.exe"
          if (-not (Test-Path $warpCli)) {
            $warpCli = "${env:ProgramFiles(x86)}\Cloudflare\Cloudflare WARP\warp-cli.exe"
          }

          function Rotate-WarpIP {
            Write-Host "  Rotating WARP IP..." -ForegroundColor Yellow
            & $warpCli disconnect 2>$null
            Start-Sleep -Seconds 2
            & $warpCli registration delete 2>$null
            Start-Sleep -Seconds 2
            & $warpCli registration new 2>$null
            Start-Sleep -Seconds 3
            & $warpCli connect 2>$null
            Start-Sleep -Seconds 6
            $newIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10) } catch { "unknown" }
            Write-Host "  New IP: $newIp" -ForegroundColor Cyan
            return $newIp
          }

          function Test-OpenCode {
            Write-Host "  Testing OpenCode..." -ForegroundColor Cyan
            $tempDir = Join-Path $env:TEMP "opencode-test-$(Get-Random)"
            New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
            Push-Location $tempDir

            # Initialize a minimal git repo (OpenCode requires one)
            git init 2>$null | Out-Null
            git config user.email "test@test.com" 2>$null
            git config user.name "test" 2>$null
            "test" | Set-Content "test.txt"
            git add . 2>$null | Out-Null
            git commit -m "init" 2>$null | Out-Null

            $result = $null
            try {
              $proc = Start-Process -FilePath "opencode" -ArgumentList "run","--standalone","say hi in one word" `
                -NoNewWindow -RedirectStandardOutput "$tempDir\stdout.txt" -RedirectStandardError "$tempDir\stderr.txt" `
                -PassThru
              $finished = $proc.WaitForExit(60000)
              if (-not $finished) {
                $proc.Kill()
              }
              $stdout = if (Test-Path "$tempDir\stdout.txt") { Get-Content "$tempDir\stdout.txt" -Raw } else { "" }
              $stderr = if (Test-Path "$tempDir\stderr.txt") { Get-Content "$tempDir\stderr.txt" -Raw } else { "" }
              $allOutput = "$stdout`n$stderr"
              Write-Host "  Exit code: $($proc.ExitCode)"
              Write-Host "  Output: $($allOutput.Substring(0, [Math]::Min(500, $allOutput.Length)))"

              if ($allOutput -match "limit|exhausted|rate|quota|429|exceeded|unavailable") {
                $result = "LIMIT_HIT"
              } elseif ($proc.ExitCode -eq 0) {
                $result = "OK"
              } else {
                $result = "ERROR"
              }
            } catch {
              Write-Host "  Exception: $_"
              $result = "ERROR"
            }

            Pop-Location
            Remove-Item $tempDir -Recurse -Force -ErrorAction SilentlyContinue
            return $result
          }

          Write-Host "========================================" -ForegroundColor Green
          Write-Host "  OpenCode Verification & Auto-Fix" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Green

          $currentIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10) } catch { "unknown" }
          Write-Host "Current IP: $currentIp"

          $maxAttempts = 8
          $success = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "`n--- Attempt $attempt/$maxAttempts ---" -ForegroundColor White
            $testResult = Test-OpenCode

            if ($testResult -eq "OK") {
              Write-Host "`n[SUCCESS] OpenCode is working!" -ForegroundColor Green
              $finalIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10) } catch { "unknown" }
              Write-Host "Working IP: $finalIp" -ForegroundColor Green
              $success = $true
              break
            } elseif ($testResult -eq "LIMIT_HIT") {
              Write-Host "  [LIMIT HIT] Rate limit detected, rotating IP..." -ForegroundColor Red
              Rotate-WarpIP
            } else {
              Write-Host "  [ERROR] OpenCode returned an error, rotating IP and retrying..." -ForegroundColor Yellow
              Rotate-WarpIP
            }
          }

          if (-not $success) {
            Write-Host "`n[WARNING] Could not find a clean IP after $maxAttempts attempts." -ForegroundColor Red
            Write-Host "OpenCode may still work - try Reset-IP.bat on Desktop manually." -ForegroundColor Yellow
          }

      - name: Create IP Reset and OpenCode Helper Scripts
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $resetScript = @'
          # Reset-IP.ps1 - Cycle WARP to get a fresh IP and bypass OpenCode limits
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "  Resetting IP via Cloudflare WARP..." -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          $warpCli = "$env:ProgramFiles\Cloudflare\Cloudflare WARP\warp-cli.exe"
          if (-not (Test-Path $warpCli)) {
            $warpCli = "${env:ProgramFiles(x86)}\Cloudflare\Cloudflare WARP\warp-cli.exe"
          }

          $oldIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10) } catch { "unknown" }
          Write-Host "Current IP: $oldIp" -ForegroundColor Yellow

          for ($cycle = 1; $cycle -le 5; $cycle++) {
            Write-Host "`nCycle $cycle/5 - Rotating..." -ForegroundColor Gray
            & $warpCli disconnect 2>$null
            Start-Sleep -Seconds 2
            & $warpCli registration delete 2>$null
            Start-Sleep -Seconds 2
            & $warpCli registration new 2>$null
            Start-Sleep -Seconds 3
            & $warpCli connect 2>$null
            Start-Sleep -Seconds 5
            try {
              $newIp = (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10)
              if ($newIp -ne $oldIp) {
                Write-Host "`n[OK] New IP: $newIp" -ForegroundColor Green
                Write-Host "Now try opening OpenCode again!" -ForegroundColor Green
                break
              } else {
                Write-Host "Same IP, trying again..." -ForegroundColor Yellow
              }
            } catch {
              Write-Host "Could not check IP, trying again..." -ForegroundColor Yellow
            }
          }

          Write-Host "`nDone! Press any key to close..." -ForegroundColor Cyan
          $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
          '@

          $desktopPath = [Environment]::GetFolderPath("Desktop")
          $resetScript | Set-Content -Path "$desktopPath\Reset-IP.ps1" -Encoding UTF8
          Write-Host "Created Reset-IP.ps1 on Desktop"

          $batchContent = @"
          @echo off
          powershell -ExecutionPolicy Bypass -File "%USERPROFILE%\Desktop\Reset-IP.ps1"
          "@
          $batchContent | Set-Content -Path "$desktopPath\Reset-IP.bat" -Encoding ASCII
          Write-Host "Created Reset-IP.bat on Desktop"

          $launcherScript = @'
          $warpCli = "$env:ProgramFiles\Cloudflare\Cloudflare WARP\warp-cli.exe"
          if (-not (Test-Path $warpCli)) {
            $warpCli = "${env:ProgramFiles(x86)}\Cloudflare\Cloudflare WARP\warp-cli.exe"
          }
          Write-Host "Rotating IP before launching OpenCode..." -ForegroundColor Cyan
          & $warpCli disconnect 2>$null
          Start-Sleep -Seconds 2
          & $warpCli registration delete 2>$null
          Start-Sleep -Seconds 2
          & $warpCli registration new 2>$null
          Start-Sleep -Seconds 3
          & $warpCli connect 2>$null
          Start-Sleep -Seconds 5
          $ip = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10) } catch { "unknown" }
          Write-Host "Current IP: $ip" -ForegroundColor Green
          Write-Host "Launching OpenCode..." -ForegroundColor Green
          & opencode @args
          '@

          $launcherScript | Set-Content -Path "$desktopPath\Start-OpenCode.ps1" -Encoding UTF8
          $launcherBatch = @"
          @echo off
          powershell -ExecutionPolicy Bypass -File "%USERPROFILE%\Desktop\Start-OpenCode.ps1"
          "@
          $launcherBatch | Set-Content -Path "$desktopPath\Start-OpenCode.bat" -Encoding ASCII
          Write-Host "Created Start-OpenCode.bat on Desktop"

      - name: Install Tailscale
        shell: powershell
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $p = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri $url -OutFile $p -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i","`"$p`"","/quiet","/norestart" -Wait
          Remove-Item $p -Force

      - name: Connect Tailscale
        shell: powershell
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=rdp-new-$env:GITHUB_RUN_ID
          $ip = $null
          for ($i = 0; $i -lt 15; $i++) {
            $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null) | Select-Object -First 1
            if ($ip) { break }
            Start-Sleep -Seconds 5
          }
          if (-not $ip) { Write-Error 'Tailscale IP not assigned'; exit 1 }
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $ip"

      - name: Install Rtl Terminal
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/mirbehnam/RtlTerminal/releases/latest" `
            -Headers @{ "User-Agent" = "github-actions"; "Accept" = "application/vnd.github+json" }
          $asset = $release.assets |
            Where-Object { $_.name -match '^RtlTerminal-Setup-.*-x64\.exe$' } |
            Select-Object -First 1
          if (-not $asset) {
            throw "No x64 installer found in RtlTerminal release $($release.tag_name)"
          }

          Write-Host "Latest Rtl Terminal: $($release.tag_name) -> $($asset.name)"
          $setup = Join-Path $env:TEMP $asset.name
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $setup -UseBasicParsing
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          Remove-Item $setup -Force

          $rtl = "C:\Program Files\behnamapps\Rtl Terminal\RtlTerminal.exe"
          if (-not (Test-Path $rtl)) { Write-Error "Rtl Terminal install check failed"; exit 1 }
          Write-Host "Rtl Terminal $($release.tag_name) installed."

      - name: Verify WARP is active and show connection info
        shell: powershell
        run: |
          $warpCli = "$env:ProgramFiles\Cloudflare\Cloudflare WARP\warp-cli.exe"
          if (-not (Test-Path $warpCli)) {
            $warpCli = "${env:ProgramFiles(x86)}\Cloudflare\Cloudflare WARP\warp-cli.exe"
          }
          Write-Host "=== WARP Status ==="
          & $warpCli status 2>$null
          Write-Host ""
          Write-Host "=== Current Public IP (via WARP) ==="
          $publicIp = (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 10)
          Write-Host "Public IP: $publicIp"
          Write-Host ""
          Write-Host "=== Tailscale IP (for RDP) ==="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "=== Connection Info ==="
          Write-Host "RDP Host: $env:TAILSCALE_IP"
          Write-Host "RDP User: RDP"
          Write-Host "RDP Pass: 12345"
          Write-Host "OpenCode outgoing IP: $publicIp (via Cloudflare WARP)"
          Write-Host ""
          Write-Host "=== Desktop Helper Scripts ==="
          Write-Host "Reset-IP.bat      -> Double-click to get a new IP"
          Write-Host "Start-OpenCode.bat -> Launch OpenCode with a fresh IP"

      - name: Keep session alive for 6 hours
        shell: powershell
        run: |
          Write-Host "RDP started. Keeping session alive for 6 hours..."
          $endTime = (Get-Date).AddHours(6)
          while ((Get-Date) -lt $endTime) {
            Write-Host "Remaining time: $(($endTime - (Get-Date)).ToString('hh\:mm\:ss'))"
            Start-Sleep -Seconds 60
          }
          Write-Host "6 hours passed. Shutting down."
